<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man in the Chair – 3D Holographic YouTube Command Deck</title>
    <link rel="stylesheet" href="./static/style.css">
</head>
<body>

    <!-- 3D Holographic Viewport -->
    <div id="viewport">
        <div class="floor-grid"></div>
        <div id="screens-cluster"></div>
    </div>

    <!-- Top HUD Bar -->
    <div class="top-hud">
        <div class="brand">
            <span class="brand-icon">💺</span>
            <div>
                <div class="brand-name">MAN IN THE CHAIR</div>
                <div class="brand-sub">3D HOLOGRAPHIC YOUTUBE COMMAND DECK</div>
            </div>
        </div>

        <form class="search-bar" id="search-form">
            <span>🔍</span>
            <input id="search-input" type="text" placeholder="Search YouTube topic, or paste any YouTube URL..." autocomplete="off" />
            <button type="submit" id="search-btn">SCAN</button>
        </form>

        <div class="hud-controls">
            <button class="hud-btn add-btn" id="btn-add">➕ ADD SCREEN</button>
            <button class="hud-btn" id="btn-mute-all">🔇 MUTE ALL</button>
            <button class="hud-btn" id="btn-reset-cam">🎯 RESET CAM</button>
            <button class="hud-btn cam-btn active" data-cam="chair">💺 CHAIR</button>
            <button class="hud-btn cam-btn" data-cam="tactical">🛰 TACTICAL</button>
            <button class="hud-btn cam-btn" data-cam="orbit">🎥 ORBIT</button>
        </div>
    </div>

    <!-- Category Pills -->
    <div class="pills-bar">
        <button class="pill active" data-cat="space">🚀 Space</button>
        <button class="pill" data-cat="ai">🤖 AI & Robotics</button>
        <button class="pill" data-cat="nature">🌿 Nature</button>
        <button class="pill" data-cat="cats">🐱 Cats</button>
        <button class="pill" data-cat="cyberpunk">🌆 Cyberpunk</button>
        <button class="pill" data-cat="f1">🏎️ Formula 1</button>
        <button class="pill" data-cat="gaming">🎮 Gaming</button>
        <button class="pill" data-cat="music">🎵 Music</button>
    </div>

    <!-- Right Panel: Screen Adjuster -->
    <div class="right-panel" id="adj-panel">
        <div class="panel-title-row">
            <span id="adj-screen-label">SCREEN #01</span>
            <button id="adj-close">✕</button>
        </div>

        <div class="slider-group">
            <label>SCALE</label>
            <input type="range" id="sl-scale" min="0.4" max="2.2" step="0.05" value="1" />
        </div>
        <div class="slider-group">
            <label>OFFSET X</label>
            <input type="range" id="sl-x" min="-700" max="700" step="10" value="0" />
        </div>
        <div class="slider-group">
            <label>OFFSET Y</label>
            <input type="range" id="sl-y" min="-400" max="400" step="10" value="0" />
        </div>
        <div class="slider-group">
            <label>DEPTH Z</label>
            <input type="range" id="sl-z" min="-400" max="400" step="10" value="0" />
        </div>
        <div class="slider-group">
            <label>ANGLE Y</label>
            <input type="range" id="sl-rot" min="-60" max="60" step="2" value="0" />
        </div>

        <div class="panel-actions">
            <button class="panel-btn" id="adj-save">💾 SAVE LAYOUT</button>
            <button class="panel-btn" id="adj-load">↺ LOAD</button>
            <button class="panel-btn danger" id="adj-remove">🗑 REMOVE</button>
        </div>
    </div>

    <!-- Bottom Cockpit Bar -->
    <div class="bottom-bar">
        <span class="stat">ACTIVE: <strong id="stat-count">0</strong></span>
        <div class="layout-btns">
            <button class="layout-btn active" data-layout="dome">DOME</button>
            <button class="layout-btn" data-layout="flat">FLAT</button>
            <button class="layout-btn" data-layout="ring">360°</button>
        </div>
        <button class="hud-btn sm" id="btn-reset-layout">↺ RESET</button>
    </div>

    <!-- Add Screen Modal -->
    <div class="modal-back" id="add-modal">
        <div class="modal">
            <div class="modal-title">➕ ADD YOUTUBE SCREEN</div>
            <div class="modal-sub">Paste a YouTube URL or enter any search topic</div>
            <input id="modal-input" type="text" placeholder="e.g. https://youtube.com/watch?v=... or 'Starship launch'" />
            <div class="modal-btns">
                <button class="panel-btn confirm" id="modal-confirm">DEPLOY</button>
                <button class="panel-btn" id="modal-cancel">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="./static/youtube_engine.js"></script>
    <script src="./static/viewport.js"></script>
    <script src="./static/app.js"></script>
</body>
</html>
